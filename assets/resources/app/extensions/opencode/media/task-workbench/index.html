<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务工作台</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><aside><div class="brand"><span class="brandmark">A</span><div>任务工作台<small>ARENA · TASK RELAY</small></div></div><nav id="nav"></nav><div class="sidebar-bottom"><span class="status-dot"></span><span id="connection-status">等待连接</span><small>任务与窗口分离 · 不含旧模型网关</small></div></aside><div class="workspace"><header><div><span class="eyebrow" id="section-label">WORKSPACE</span><h1 id="title">工作台</h1></div><div class="header-actions"><span id="role" class="pill">未连接</span><button id="refresh" class="icon-button" title="刷新状态">↻ 刷新</button></div></header><div id="notice" role="status"></div><main id="content"></main></div></div><dialog id="dialog"><form id="dialog-form"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="dialog-close" aria-label="关闭">×</button></div><div id="dialog-body"></div><div class="dialog-actions"><button type="button" id="dialog-cancel">取消</button><button type="submit" class="primary">确认</button></div></form></dialog><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
