<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作</title>
<link rel="stylesheet" href="work.css">
</head>
<body class="wk-app work-page">
<header class="wk-toolbar" role="toolbar" aria-label="工作工具栏">
  <div class="wk-title"><span class="codicon codicon-checklist" aria-hidden="true"></span><h1>工作</h1><span id="summary" class="wk-sub"></span></div>
  <div class="wk-search"><span class="codicon codicon-search" aria-hidden="true"></span><input id="search" class="wk-input" type="search" placeholder="搜索标题、描述或编号（/）" aria-label="搜索工作项"></div>
  <select id="project-filter" class="wk-select" aria-label="按项目筛选"></select>
  <select id="assignee-filter" class="wk-select" aria-label="按负责人筛选"></select>
  <button id="show-closed" class="wk-btn ghost" type="button" aria-pressed="false" title="显示「已完成」「已取消」两列"><span class="codicon codicon-pass" aria-hidden="true"></span>已结束</button>
  <span class="wk-spacer"></span>
  <button id="refresh" class="wk-icon-btn" type="button" title="刷新" aria-label="刷新" data-label="刷新"><span class="codicon codicon-refresh" aria-hidden="true"></span></button>
  <button id="new-project" class="wk-icon-btn" type="button" title="项目与数据位置" aria-label="项目与数据位置" data-label="项目"><span class="codicon codicon-folder" aria-hidden="true"></span></button>
  <button id="new-item" class="wk-btn primary" type="button"><span class="codicon codicon-add" aria-hidden="true"></span>新建</button>
</header>
<div class="wk-hint-line"><span class="codicon codicon-info codicon-sm" aria-hidden="true"></span>代理开工置「进行中」、交付到「待验收」；只有你能标记「已完成」。</div>
<main class="wk-main">
  <div class="wk-content"><div id="board" class="wk-board" aria-label="看板"></div></div>
  <aside id="detail" class="wk-drawer" aria-label="工作项详情" hidden></aside>
</main>
<div id="feedback" class="wk-feedback" role="status" aria-live="polite"></div>
<script src="work.js"></script>
</body>
</html>
