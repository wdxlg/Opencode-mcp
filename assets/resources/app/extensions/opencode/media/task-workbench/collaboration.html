<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>团队协作</title>
<link rel="stylesheet" href="automation.css">
</head>
<body class="tc-body">
<div class="tc-app">
<header class="tc-head">
<h1>团队协作</h1>
<nav class="tc-tabs" role="tablist"><button id="tab-canvas" role="tab" aria-selected="true">画布</button><button id="tab-members" role="tab" aria-selected="false">成员</button><button id="tab-chat" role="tab" aria-selected="false">聊天<span id="tc-tab-dot" class="tc-tab-dot" hidden></span></button></nav>
<div class="cv-proj" title="切换项目"><select id="workspace" class="tc-project" aria-label="项目"></select><span id="cv-proj-path" class="cv-proj-path"></span></div>
<button id="add-workspace" class="tc-icon-btn" title="指定项目文件夹" aria-label="指定项目文件夹">＋</button>
<button id="refresh" class="tc-icon-btn" title="刷新" aria-label="刷新">⟳</button>
<span class="tc-grow"></span>
<span id="cv-online" class="cv-online" title="画布上的 AI"></span>
</header>
<div id="feedback" class="tc-feedback" role="status" aria-live="polite"></div>
<section id="tc-off" class="tc-off" hidden><div class="tc-off-card"><div class="tc-off-icon">◎</div><h2>正在开启团队协作…</h2><p>如果一直停在这里，点下面的按钮重试。</p><button id="tc-enable">重试</button></div></section>
<main id="collaboration-content" class="tc-main" hidden>
<section id="page-canvas" class="tc-canvaspage cv-page">
<aside class="cv-side" aria-label="画布上的 AI"><div class="cv-side-head">画布上的 AI</div><input id="cv-search" class="cv-search" type="search" placeholder="找 AI 或任务  /"><div id="cv-side-list" class="cv-side-list"></div></aside>
<section class="cv-center">
<div id="cv-chips" class="cv-chips" role="group" aria-label="按状态筛选 AI" hidden></div>
<div id="cv-needpop" class="cv-needpop" hidden></div>
<section class="tc-stage cv-one" aria-label="画布">
<div class="tc-scroll" id="tc-scroll" title="">
<svg id="tc-canvas" class="tc-canvas" role="img" aria-label="画布：成员与在线 AI"><defs>
<pattern id="tc-grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" class="tc-grid-dot"></circle></pattern>
<marker id="tc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="tc-arrow-head"></path></marker>
<marker id="tc-arrow-sel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="tc-arrow-head sel"></path></marker>
</defs><rect id="tc-bg" width="100%" height="100%" fill="url(#tc-grid)"></rect><g id="tc-world"><g id="tc-edges"></g><g id="tc-nodes"></g></g></svg>
<div id="cv-world" class="cv-world"><svg id="cv-links" class="cv-links" aria-hidden="true"><defs><marker id="cv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"></path></marker></defs><g id="cv-links-g"></g></svg><div id="cv-items"></div></div>
<div id="cv-toolbar" class="cv-zoombar" role="toolbar" aria-label="画布工具栏"><div class="cv-tgroup" role="group" aria-label="缩放"><button id="cv-zoom-out" type="button" title="缩小（也可以用鼠标滚轮）" aria-label="缩小"><span class="cv-ic" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8h9"/></svg></span></button><button id="cv-zoom-pct" class="cv-zoom-pct" type="button" title="当前缩放比例，点一下恢复 100%" aria-label="恢复 100%">100%</button><button id="cv-zoom-in" type="button" title="放大（也可以用鼠标滚轮）" aria-label="放大"><span class="cv-ic" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8h9M8 3.5v9"/></svg></span></button><button id="cv-fit" type="button" title="适应窗口：缩放并移动画布，让所有成员和 AI 都能看到（快捷键 .）" aria-label="适应窗口"><span class="cv-ic" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></span><span class="cv-lbl">适应</span></button></div><span class="cv-sep"></span><div class="cv-tgroup" role="group" aria-label="排布"><button id="cv-autolayout" type="button" title="自动排列：成员按上下级排好，AI 分组回到默认位置" aria-label="自动排列"><span class="cv-ic" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx=".8"/><rect x="9" y="2.5" width="4.5" height="4.5" rx=".8"/><rect x="2.5" y="9" width="4.5" height="4.5" rx=".8"/><rect x="9" y="9" width="4.5" height="4.5" rx=".8"/></svg></span><span class="cv-lbl">自动排列</span></button><button id="cv-focus" type="button" title="居中：把选中的成员或 AI（没选时为当前项目）移到画布中央" aria-label="居中"><span class="cv-ic" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="4.5"/><circle cx="8" cy="8" r="1.2" fill="currentColor"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2"/></svg></span><span class="cv-lbl">居中</span></button></div><span class="cv-sep"></span><div class="cv-tgroup tc-addwrap cv-presetwrap" role="group" aria-label="预设"><button id="tc-preset-btn" type="button" aria-haspopup="menu" aria-expanded="false" title="团队预设：把画布上的成员、位置和连线存成预设，所有项目通用" aria-label="预设"><span class="cv-ic" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5h7M2.5 8h7M2.5 11.5h4.5"/><path d="M11 9.5l1.5 1.5 1.5-1.5"/></svg></span><span class="cv-lbl">预设</span></button><div id="tc-presetpop" class="tc-addpop tc-presetpop" role="menu" hidden></div></div></div>
<div id="tc-minimap" class="tc-minimap" aria-label="小地图" title="小地图：点一下或拖动跳到那里" hidden><svg id="tc-mini" width="180" height="116"><g id="tc-mini-nodes"></g><rect id="tc-mini-view" class="tc-mini-view"></rect></svg></div>
</div>
</section>
</section>
<aside class="cv-right" aria-label="变更、活动与浏览器"><div id="cv-rtabs" class="cv-rtabs" role="tablist"></div><div id="cv-rbody" class="cv-rbody"></div></aside>
</section>
<section id="page-members" class="tc-memberpage" aria-label="成员管理" hidden>
<section class="tc-mmain">
<div class="tc-mhead"><h2>成员<span id="tc-mcount" class="tc-mcount"></span></h2><input id="tc-msearch" class="tc-msearch" type="search" placeholder="搜索名字、岗位或模型"><span class="tc-grow"></span><button id="tc-add" class="tc-primary">＋ 新成员</button></div>
<div id="tc-mlist" class="tc-mlist" role="list"></div>
</section>
<aside id="tc-editor" class="tc-mpanel">
<div id="tc-editor-empty" class="tc-mpanel-empty"><div class="tc-off-icon">👤</div><p>选择左侧成员查看和修改设置，或点「＋ 新成员」。</p></div>
<form id="tc-form" hidden>
<div class="tc-drawer-head"><h2 id="tc-editor-title">成员</h2><button id="tc-cancel" type="button" class="tc-icon-btn" aria-label="关闭">✕</button></div>
<div class="tc-field tc-avatar-field"><span>头像</span><div class="tc-avatar-edit"><span id="tc-avatar-preview" class="tc-avatar-chip tc-avatar-big" role="button" tabindex="0" title="点一下上传图片，上传后可以拖动、缩放选头像区域"></span><button id="tc-avatar-pick" type="button" class="tc-ghost">上传图片…</button><button id="tc-avatar-clear" type="button" class="tc-danger-link" hidden>去掉头像</button><input id="tc-avatar-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden></div></div>
<label class="tc-field"><span>名字</span><input id="tc-name" maxlength="40" required placeholder="例如：经理、前端、后端"></label>
<label class="tc-field"><span>岗位</span><select id="tc-role"></select></label>
<div id="tc-new-role" class="tc-subcard" hidden>
<label class="tc-field"><span>新岗位名称</span><input id="tc-role-name" maxlength="60"></label>
<label class="tc-field"><span>岗位职责</span><textarea id="tc-role-duty" rows="3" placeholder="例如：负责前端页面与交互"></textarea></label>
</div>
<label class="tc-field"><span>执行方式</span><select id="tc-kind"><option value="api">模型（可对话、可执行）</option><option value="mcp">外部 MCP 代理（只领任务）</option></select></label>
<div class="tc-field" id="tc-model-row"><span>模型</span><input type="hidden" id="tc-model"><div class="tc-mpick"><button type="button" id="tc-model-btn" class="tc-mpick-btn" aria-haspopup="listbox" aria-expanded="false"><span id="tc-model-label" class="tc-mpick-label">选择模型</span><span id="tc-model-group" class="tc-mpick-group"></span><span class="tc-mpick-caret">▾</span></button><div id="tc-model-pop" class="tc-mpick-pop" hidden><div class="tc-mpick-search"><input id="tc-model-search" type="text" placeholder="搜索模型" autocomplete="off" spellcheck="false"></div><div id="tc-model-top" class="tc-mpick-h tc-mpick-top"></div><div id="tc-model-list" class="tc-mpick-list" role="listbox"></div></div></div></div>
<label class="tc-check"><input id="tc-enabled" type="checkbox" checked><span>启用</span></label>
<div class="tc-subcard" id="tc-sub-box">
<label class="tc-check"><input id="tc-allow-sub" type="checkbox"><span>允许创建子代理</span></label>
<label class="tc-field tc-inline" id="tc-sub-max-row"><span>最多同时</span><input id="tc-sub-max" type="number" min="1" max="8" value="3"><span>个</span></label>
<div id="tc-sub-list" class="tc-sub-list"></div>
<p class="tc-note">子代理是临时帮手，继承该成员的模型，只向它汇报，用完可随时删除。</p>
</div>
<details class="tc-more"><summary>权限</summary>
<label class="tc-field"><span>可写目录（每行一个，. 为整个项目）</span><textarea id="tc-paths" rows="2">.</textarea></label>
<label class="tc-check"><input id="tc-shell" type="checkbox"><span>允许执行 Shell 命令</span></label>
</details>
<div id="tc-custom" class="tc-custom-host"></div>
<div class="tc-drawer-actions"><button id="tc-delete" type="button" class="tc-danger-link">删除成员</button><button id="tc-dm" type="button" class="tc-ghost">💬 私聊</button><span class="tc-grow"></span><button id="tc-save" type="submit">保存</button></div>
</form>
</aside>
</section>
<section id="page-chat" class="tc-chatpage" aria-label="聊天" hidden>
<aside class="tc-convs">
<div class="tc-convs-head">会话</div>
<div id="tc-conv-list" class="tc-conv-list"></div>
</aside>
<section class="tc-chat">
<div class="tc-chat-head"><span id="tc-chat-avatar"></span><div class="tc-chat-title"><h2 id="tc-chat-name">群聊</h2><span id="tc-chat-sub" class="tc-chat-sub"></span></div><span class="tc-grow"></span><span id="tc-busy" class="tc-typing"></span><button id="tc-stop" class="tc-ghost" hidden>■ 停止</button><button id="tc-rules" class="tc-ghost" title="团队规则（可编辑）：路由偏好、什么时候要找你等，只给被你 @ 的负责人看">规则</button><button id="tc-clear" class="tc-ghost" title="清空当前会话的聊天记录（再点一次确认）">清空</button></div><div id="tc-rules-box" hidden style="padding:8px 12px;border-bottom:1px solid var(--vscode-panel-border,#333)"><textarea id="tc-rules-text" rows="5" maxlength="4000" style="width:100%;box-sizing:border-box;resize:vertical" placeholder="团队规则，只给负责人看。例如：数据库相关交给后端；改动涉及删除文件先问我。"></textarea><div style="display:flex;gap:6px;justify-content:flex-end;margin-top:6px"><button id="tc-rules-cancel" class="tc-ghost">取消</button><button id="tc-rules-save" class="tc-primary small">保存</button></div></div>
<div id="tc-messages" class="tc-messages" role="log" aria-live="polite"></div>
<div class="tc-composer">
<div id="tc-at-pop" class="tc-at-pop" role="listbox" hidden></div>
<div class="tc-input-wrap"><div id="tc-input-mirror" class="tc-input-mirror" aria-hidden="true"></div><textarea id="tc-input" rows="2"></textarea></div>
<div class="tc-composer-bar"><button id="tc-attach" type="button" class="tc-ibtn" title="附件（文本文件内容会附在消息里）"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 4.5 5.4 9.6a1.4 1.4 0 0 0 2 2l5.3-5.3a2.8 2.8 0 0 0-4-4L3.4 7.6a4.2 4.2 0 0 0 6 6l4.1-4.1"/></svg></button><input id="tc-file" type="file" multiple hidden><button id="tc-mcp" type="button" class="tc-ibtn" title="MCP 工具"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5v3M10 2.5v3M4.5 5.5h7v2.5a3.5 3.5 0 0 1-7 0z M8 11.5v2"/></svg></button><button id="tc-voice" type="button" class="tc-ibtn" title="语音输入"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="5.75" y="2" width="4.5" height="7.5" rx="2.25"/><path d="M3.5 8a4.5 4.5 0 0 0 9 0M8 12.5V14"/></svg></button><button id="tc-popout" type="button" class="tc-ibtn" title="在 Chat 里和团队对话（@team，完整 Chat 功能）"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2.5h4.5V7M13.5 2.5 8 8M11.5 9.5v3a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3"/></svg></button><span id="tc-attach-list" class="tc-attach-list"></span><span class="tc-grow"></span><span id="tc-compose-hint" class="tc-kbd">Enter 发送 · Shift+Enter 换行</span><button id="tc-send" type="button" class="tc-sendbtn" title="发送 (Enter)" aria-label="发送"></button></div>
</div>
</section>
</section>
</main>
</div>
<script src="collaboration.js"></script>
</body>
</html>
