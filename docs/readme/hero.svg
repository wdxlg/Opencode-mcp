<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2c3340"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14171c"/>
      <stop offset="1" stop-color="#1b2230"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif}
      .wire{fill:none;stroke-width:2.2;stroke-dasharray:6 6;animation:flow 1.2s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-24}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <rect width="960" height="300" rx="14" fill="url(#bg)"/>
  <rect width="960" height="300" rx="14" fill="url(#dots)"/>

  <text x="48" y="118" class="t" font-size="54" font-weight="700" fill="#e8edf5">OpenCode</text>
  <text x="50" y="158" class="t" font-size="19" fill="#9fb0c6">规则中心 · MCP Bridge · 多智能体协作画布</text>
  <text x="50" y="190" class="t" font-size="15" fill="#6f7f95">基于 Code-OSS 的桌面编辑器，Windows x64</text>

  <!-- wires -->
  <path id="w1" d="M560 92 C 620 92, 620 70, 680 70" class="wire" stroke="#3794ff"/>
  <path id="w2" d="M560 92 C 630 92, 610 190, 680 190" class="wire" stroke="#4ec9b0"/>
  <path id="w3" d="M800 70 C 850 70, 830 130, 880 130" class="wire" stroke="#3794ff"/>
  <path id="w4" d="M800 190 C 850 190, 830 130, 880 130" class="wire" stroke="#4ec9b0"/>
  <path id="w5" d="M560 230 C 620 230, 620 205, 680 205" class="wire" stroke="#d7ba7d"/>

  <!-- moving packets -->
  <circle r="4.5" fill="#7cc4ff" filter="url(#glow)"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle>
  <circle r="4.5" fill="#7ee8d0" filter="url(#glow)"><animateMotion dur="2.6s" begin="0.6s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle>
  <circle r="4.5" fill="#7cc4ff" filter="url(#glow)"><animateMotion dur="2s" begin="1.1s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle>
  <circle r="4.5" fill="#7ee8d0" filter="url(#glow)"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#w4"/></animateMotion></circle>
  <circle r="4" fill="#f2d49a" filter="url(#glow)"><animateMotion dur="2.8s" begin="0.3s" repeatCount="indefinite"><mpath href="#w5"/></animateMotion></circle>

  <!-- nodes -->
  <g class="t">
    <g transform="translate(440 62)">
      <rect width="120" height="60" rx="7" fill="#252a33" stroke="#3a4250"/>
      <rect width="120" height="22" rx="7" fill="#2d4a7a"/><rect y="15" width="120" height="7" fill="#2d4a7a"/>
      <text x="10" y="16" font-size="12" fill="#e8edf5">模型</text>
      <text x="10" y="44" font-size="11" fill="#9fb0c6">推理强度 · 高</text>
      <circle cx="120" cy="30" r="5" fill="#3794ff"/>
    </g>
    <g transform="translate(440 200)">
      <rect width="120" height="56" rx="7" fill="#252a33" stroke="#3a4250"/>
      <rect width="120" height="22" rx="7" fill="#2b5a5a"/><rect y="15" width="120" height="7" fill="#2b5a5a"/>
      <text x="10" y="16" font-size="12" fill="#e8edf5">共享看板</text>
      <text x="10" y="42" font-size="11" fill="#9fb0c6">登录与注册</text>
      <circle cx="120" cy="30" r="5" fill="#d7ba7d"/>
    </g>
    <g transform="translate(680 40)">
      <rect width="120" height="64" rx="7" fill="#252a33" stroke="#3794ff"/>
      <circle cx="16" cy="13" r="7" fill="#4ec9b0"/>
      <text x="29" y="17" font-size="12" fill="#e8edf5">经理 A</text>
      <text x="10" y="40" font-size="11" fill="#9fb0c6">岗位 · 规划</text>
      <rect x="10" y="48" width="56" height="9" rx="4.5" fill="#1e3a5f"/><rect x="10" y="48" width="56" height="9" rx="4.5" fill="#3794ff" class="pulse"/>
      <circle cx="0" cy="30" r="5" fill="#3794ff"/><circle cx="120" cy="30" r="5" fill="#3794ff"/>
    </g>
    <g transform="translate(680 160)">
      <rect width="120" height="64" rx="7" fill="#252a33" stroke="#3a4250"/>
      <circle cx="16" cy="13" r="7" fill="#e3a14b"/>
      <text x="29" y="17" font-size="12" fill="#e8edf5">成员 B</text>
      <text x="10" y="40" font-size="11" fill="#9fb0c6">岗位 · 开发</text>
      <circle cx="0" cy="30" r="5" fill="#4ec9b0"/><circle cx="0" cy="45" r="5" fill="#d7ba7d"/><circle cx="120" cy="30" r="5" fill="#4ec9b0"/>
    </g>
    <g transform="translate(880 100)">
      <rect width="56" height="60" rx="7" fill="#252a33" stroke="#3a4250"/>
      <circle cx="28" cy="16" r="7" fill="#d16d9e"/>
      <text x="28" y="44" font-size="11" fill="#9fb0c6" text-anchor="middle">审查</text>
      <circle cx="0" cy="30" r="5" fill="#3794ff"/>
    </g>
    <g transform="translate(605 268)">
      <rect width="150" height="20" rx="10" fill="#1e3a5f"/>
      <text x="75" y="14" font-size="11" fill="#9cd0ff" text-anchor="middle">派活 · 经理 A → 成员 B</text>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.8;1" dur="3.5s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
